name = "ft/rwa"
version = "0.0.0"
compiler = "v1.1.24"
plutus = "v3"
license = "Apache-2.0"
description = "Aiken contracts for project 'ft/rwa'"

[repository]
user = "ft"
project = "rwa"
platform = "github"

[[dependencies]]
name = "aiken-lang/stdlib"
version = "v4.0.0"
source = "github"

[[dependencies]]
name = "anastasia-labs/aiken-design-patterns"
version = "v1.9.0"
source = "github"

[[dependencies]]
name = "aiken-lang/merkle-patricia-forestry"
version = "v2.1.0"
source = "github"

# Transitive dependencies of anastasia-labs/aiken-design-patterns v1.9.0.
# Declared explicitly because its non-test `utils.ak` imports `aiken/fuzz` at
# module level, and Aiken (still in v1.1.24) does not resolve a dependency's own
# manifest.
[[dependencies]]
name = "aiken-lang/fuzz"
version = "v3.0.0"
source = "github"

[[dependencies]]
name = "keyan-m/aiken-scott-utils"
version = "v1.5.0"
source = "github"

[config]
