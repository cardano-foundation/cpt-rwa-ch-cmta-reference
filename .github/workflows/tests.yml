name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.24
      - run: aiken fmt --check
      # Run the test suite under a pseudo-terminal. `aiken check` switches to
      # JSON output when stdout is not a TTY — which a CI log is not — and in
      # that mode it prints no diagnostics at all: a failing test shows up as a
      # bare non-zero exit with no assertion, no trace and no test name. The
      # job fails correctly either way; this is purely so the log says WHY.
      # `script -e` propagates the child's exit code (util-linux, present on
      # ubuntu-latest).
      - run: script -q -e -c "aiken check -D" /dev/null
      - run: aiken build
      - run: git diff --exit-code -- plutus.json
